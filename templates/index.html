<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Web IFPB</title>
    
    <!-- Fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Biblioteca de Ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-page: #e2e8f0;
            --bg-browser: #ffffff;
            --topbar: #f1f5f9;
            --text-main: #334155;
            --text-light: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --display-bg: #0f172a;
            --display-text: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Janela do Navegador */
        .browser-window {
            width: 100%;
            max-width: 900px;
            background: var(--bg-browser);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho estético (Bolinhas do Mac) */
        .window-header {
            background: var(--topbar);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background-color: #ef4444; }
        .dot.yellow { background-color: #f59e0b; }
        .dot.green { background-color: #10b981; }

        /* Barra de Ferramentas e URL */
        .toolbar {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--topbar);
            color: var(--text-main);
        }

        .url-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--topbar);
            border-radius: 20px;
            padding: 6px 16px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .url-container:focus-within {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .url-container i {
            color: var(--text-light);
            margin-right: 10px;
            font-size: 14px;
        }

        .url-container input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            padding: 4px 0;
        }

        .btn-go {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-go:hover {
            background: var(--accent-hover);
        }

        /* Status Home */
        .status-bar {
            padding: 8px 20px;
            background: #f8fafc;
            font-size: 13px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #e2e8f0;
            font-family: monospace;
        }

        .status-bar i { color: var(--accent); }

        /* Tela de Exibição (Estilo Terminal Moderno) */
        .display-area {
            background: var(--display-bg);
            color: var(--display-text);
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Animação de carregamento (Pulse) */
        .loading {
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="browser-window">
    <!-- Decoração da janela -->
    <div class="window-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
    </div>

    <!-- Barra de Ferramentas -->
    <div class="toolbar">
        <button class="btn-icon" onclick="comandoDireto('#back')" title="Voltar (ou digite #back)">
            <i class="fas fa-arrow-left"></i>
        </button>
        
        <button class="btn-icon" onclick="comandoDireto('#showhist')" title="Histórico (ou digite #showhist)">
            <i class="fas fa-clock-rotate-left"></i>
        </button>

        <div class="url-container">
            <i class="fas fa-lock"></i>
            <input type="text" id="campo-url" placeholder="Pesquise uma URL ou digite um comando..." onkeypress="checarEnter(event)">
        </div>

        <button class="btn-icon" onclick="adicionarSite()" title="Registrar Site (ou digite #add <url>)">
            <i class="fas fa-plus-circle"></i>
        </button>

        <button class="btn-go" onclick="enviarComando()">Navegar</button>
    </div>

    <!-- Barra de Status (Home) -->
    <div class="status-bar">
        <i class="fas fa-house"></i>
        <strong>Home:</strong> <span id="home-label">[ ]</span>
    </div>

    <!-- Tela do conteúdo -->
    <div id="display" class="display-area">Iniciando simulador...
Digite uma URL, clique nos botões ou use comandos (#back, #showhist).
----------------------------------------------------------------</div>
</div>

<script>
    const input = document.getElementById('campo-url');
    const display = document.getElementById('display');
    const homeLabel = document.getElementById('home-label');

    // Função auxiliar para os botões enviarem comandos diretamente
    async function comandoDireto(cmd) {
        input.value = cmd;
        await enviarComando();
    }

    // Função especial para o botão de Adicionar Site
    async function adicionarSite() {
        const novaUrl = prompt("Qual URL você deseja registrar no banco de dados?\nEx: www.uol.com.br");
        if (novaUrl && novaUrl.trim() !== "") {
            await comandoDireto(`#add ${novaUrl}`);
        }
    }

    // Função principal de comunicação com o app.py
    async function enviarComando() {
        const entrada = input.value.trim();
        if (!entrada) return;

        // Feedback visual na tela
        display.innerHTML += `\n<span style="color:#3b82f6;">> ${entrada}</span>\n<span class="loading"><i class="fas fa-spinner fa-spin"></i> Processando...</span>`;
        display.scrollTop = display.scrollHeight;

        try {
            const resposta = await fetch('/api/executar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ entrada: entrada })
            });

            const dados = await resposta.json();

            // Remove a mensagem de carregamento substituindo o HTML
            display.innerHTML = display.innerHTML.replace('<span class="loading"><i class="fas fa-spinner fa-spin"></i> Processando...</span>', '');

            if (dados.status === 'sucesso') {
                homeLabel.innerText = `[ ${dados.home} ]`;
                display.innerText += dados.conteudo;
            } else {
                display.innerHTML += `<span style="color:#ef4444;">Erro: ${dados.mensagem}</span>`;
            }
        } catch (erro) {
            display.innerHTML = display.innerHTML.replace('<span class="loading"><i class="fas fa-spinner fa-spin"></i> Processando...</span>', '');
            display.innerHTML += `\n<span style="color:#ef4444;">Erro Crítico: Falha ao conectar com o servidor Python.</span>`;
        }

        input.value = '';
        display.scrollTop = display.scrollHeight;
    }

    function checarEnter(event) {
        if (event.key === 'Enter') {
            enviarComando();
        }
    }
</script>

</body>
</html>
